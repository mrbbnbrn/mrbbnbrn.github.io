<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Şamata – Oda daveti</title><meta name="description" content="Şamata oda daveti / room invite"><link rel="icon" href="/assets/icon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFD23F;--ink:#1A1A1A;--pink:#FFB3D2;--blue:#A9D3FF;--green:#A8EDC8;--white:#fff}
*{box-sizing:border-box}html{background:var(--y)}
body{margin:0;min-height:100vh;color:var(--ink);font:600 17px/1.55 Nunito,system-ui,sans-serif;
background:var(--y) radial-gradient(circle,#F2C12E 4px,transparent 5px) 0 0/44px 44px;padding:28px 16px 60px}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--white);border:4px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);padding:24px 22px;margin:22px 0}
h1,.btn,.chip,.lang{font-family:Fredoka,Nunito,sans-serif}
h1{font-size:32px;line-height:1.15;margin:0 0 6px;overflow-wrap:anywhere}
.head{display:flex;align-items:center;gap:14px}
.head img{width:64px;height:64px;border-radius:18px;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.brand{font-family:Fredoka,sans-serif;font-size:30px;font-weight:700}
.sub{margin:0;opacity:.8}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--y);font-size:17px;font-weight:600;max-width:100%;overflow-wrap:anywhere}
.chip b{font-weight:700;letter-spacing:.06em}
.chip.blue{background:var(--blue)}
.btns{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.btn{display:block;text-align:center;padding:16px 20px;border:4px solid var(--ink);border-radius:22px;background:var(--white);box-shadow:5px 5px 0 var(--ink);font-size:24px;font-weight:700;text-decoration:none;color:var(--ink);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.pink{background:var(--pink)}.btn.green{background:var(--green)}
.note{margin:18px 0 0;padding:12px 14px;border:3px dashed var(--ink);border-radius:16px;background:#FFF6D6}
ol{margin:10px 0 0;padding-left:22px}li{margin:4px 0}
.foot{text-align:center;font-size:14px;opacity:.75}
.lang{background:none;border:0;font-size:15px;text-decoration:underline;cursor:pointer;color:var(--ink);padding:0}
a{color:var(--ink);font-weight:800}
[hidden]{display:none!important}
</style></head><body><div class="wrap">
<div class="head"><img src="/assets/icon.png" alt=""><div class="brand">Şamata</div></div>
<div class="card">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="chips">
    <span class="chip" id="codeChip" hidden><span id="codeLbl"></span> <b id="code"></b></span>
    <span class="chip blue" id="wifiChip" hidden><span id="wifiLbl"></span> <span id="ssid"></span></span>
    <span class="chip blue" id="passChip" hidden><span id="passLbl"></span> <span id="pass"></span></span>
  </div>
  <div class="btns">
    <a class="btn pink" id="open" href="#" hidden></a>
    <a class="btn green" id="get" href="https://play.google.com/store/apps/details?id=com.baro.partypack"></a>
  </div>
  <p class="note" id="nonAndroid" hidden></p>
  <div id="steps"></div>
</div>
<p class="foot"><button class="lang" id="langBtn" type="button"></button> · <a href="/">Şamata</a> · <a href="/privacy/" id="privacy"></a></p>
</div>
<script>
(function(){
  var PLAY = "https://play.google.com/store/apps/details?id=com.baro.partypack";
  var T = {
    tr: {
      invitedNamed: function(n){ return /odas[ıi]$/i.test(n) ? n + "na davet edildin" : n + " odasına davet edildin"; },
      invited: "Bir Şamata odasına davet edildin",
      sub: "Arkadaşların seni bekliyor. Telefonlarla birlikte oynayın!",
      code: "Oda kodu", wifi: "Wi-Fi:", pass: "Şifre:",
      open: "Şamata'da aç", get: "Şamata'yı indir",
      nonAndroid: "Şamata şimdilik yalnızca Android'de var. Bu bağlantıyı Android telefonunda aç.",
      steps: ["Şamata yüklü değilse önce indir.", "Sonra bu sayfaya dönüp <b>Şamata'da aç</b>'a dokun.", "Telefon “İnternet yok” derse <b>Bağlı kal</b>'ı seç."],
      stepsNoWifi: ["Şamata yüklü değilse önce indir.", "Odayı kuranla aynı Wi-Fi'ya bağlan.", "<b>Şamata'da aç</b>'a dokun ya da uygulamada oda kodunu yaz."],
      missing: "Bu bağlantıda oda bilgisi yok. Davet bağlantısının tamamını açtığından emin ol.",
      lang: "English", privacy: "Gizlilik", doc: "tr", title: "Şamata – Oda daveti"
    },
    en: {
      invitedNamed: function(n){ return "You're invited to “" + n + "”"; },
      invited: "You're invited to a Şamata room",
      sub: "Your friends are waiting. Play together on your phones!",
      code: "Room code", wifi: "Wi-Fi:", pass: "Password:",
      open: "Open in Şamata", get: "Get Şamata",
      nonAndroid: "Şamata is only on Android for now. Open this link on an Android phone.",
      steps: ["If you don't have Şamata yet, get it first.", "Then come back here and tap <b>Open in Şamata</b>.", "If the phone says “No internet”, choose <b>Stay connected</b>."],
      stepsNoWifi: ["If you don't have Şamata yet, get it first.", "Join the same Wi-Fi as the room's host.", "Tap <b>Open in Şamata</b>, or type the room code in the app."],
      missing: "This link has no room details. Make sure you opened the whole invite link.",
      lang: "Türkçe", privacy: "Privacy", doc: "en", title: "Şamata – Room invite"
    }
  };

  function params(){
    var out = {c:"", s:"", p:"", n:""};
    var raw = (location.search.replace(/^\?/, "") + "&" + location.hash.replace(/^#/, "")).split("&");
    for (var i = 0; i < raw.length; i++) {
      var eq = raw[i].indexOf("=");
      if (eq <= 0) continue;
      var k = raw[i].slice(0, eq);
      if (!(k in out)) continue;
      var v = raw[i].slice(eq + 1);
      try { v = decodeURIComponent(v); } catch (e) {}
      out[k] = v.trim().slice(0, 64);
    }
    return out;
  }

  var P = params();
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var lang = /^tr\b/i.test(navigator.language || "") ? "tr" : "en";

  function intentUrl(){
    var q = [];
    ["c","s","p","n"].forEach(function(k){ if (P[k]) q.push(k + "=" + encodeURIComponent(P[k])); });
    return "intent://join?" + q.join("&") + "#Intent;scheme=samata;package=com.baro.partypack;S.browser_fallback_url=" + encodeURIComponent(PLAY) + ";end";
  }

  function $(id){ return document.getElementById(id); }

  function render(){
    var t = T[lang];
    document.documentElement.lang = t.doc;
    document.title = t.title;
    $("title").textContent = P.n ? t.invitedNamed(P.n) : t.invited;
    $("sub").textContent = t.sub;
    $("codeChip").hidden = !P.c; $("codeLbl").textContent = t.code; $("code").textContent = P.c;
    $("wifiChip").hidden = !P.s; $("wifiLbl").textContent = t.wifi; $("ssid").textContent = P.s;
    $("passChip").hidden = !(P.s && P.p); $("passLbl").textContent = t.pass; $("pass").textContent = P.p;
    var hasRoom = !!(P.c || P.s);
    $("open").hidden = !(android && hasRoom);
    $("open").textContent = t.open;
    $("open").href = intentUrl();
    $("get").textContent = t.get;
    $("nonAndroid").hidden = android && hasRoom;
    $("nonAndroid").textContent = android ? t.missing : t.nonAndroid;
    var steps = P.s ? t.steps : t.stepsNoWifi;
    $("steps").innerHTML = (android && hasRoom) ? "<ol><li>" + steps.join("</li><li>") + "</li></ol>" : "";
    $("langBtn").textContent = t.lang;
    $("privacy").textContent = t.privacy;
    $("privacy").href = lang === "en" ? "/privacy/#en" : "/privacy/";
  }

  $("langBtn").addEventListener("click", function(){ lang = lang === "tr" ? "en" : "tr"; render(); });
  render();
})();
</script>
</body></html>
